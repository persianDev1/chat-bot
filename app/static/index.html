<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند املاک</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- صفحه ورود -->
    <div id="login-page" class="page active">
        <div class="login-container">
            <div class="logo-container">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h1>دستیار هوشمند املاک</h1>
                <p class="subtitle">مشاور شما برای خرید، فروش و اجاره ملک</p>
            </div>
            
            <div class="login-form">
                <div class="form-group">
                    <label for="phone-input">شماره موبایل خود را وارد کنید</label>
                    <input 
                        type="tel" 
                        id="phone-input" 
                        class="phone-input" 
                        placeholder="09123456789"
                        maxlength="11"
                        autocomplete="tel"
                    >
                    <span class="error-message" id="phone-error"></span>
                </div>
                
                <button id="start-chat-btn" class="btn-primary">
                    <span class="btn-text">شروع گفتگو</span>
                    <span class="btn-loader"></span>
                </button>
                
                <div class="features">
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2"/>
                            <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span>پاسخگویی ۲۴ ساعته</span>
                    </div>
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M21 15C21 15.5304 20.7893 16.0391 20.4142 16.4142C20.0391 16.7893 19.5304 17 19 17H7L3 21V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>مشاوره تخصصی</span>
                    </div>
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M12 15C15.866 15 19 11.866 19 8C19 4.13401 15.866 1 12 1C8.13401 1 5 4.13401 5 8C5 11.866 8.13401 15 12 15Z" stroke="currentColor" stroke-width="2"/>
                            <path d="M8.21 13.89L7 23L12 20L17 23L15.79 13.88" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>بهترین پیشنهادات</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- صفحه چت -->
    <div id="chat-page" class="page">
        <div class="chat-container">
            <!-- هدر چت -->
            <div class="chat-header">
                <div class="header-content">
                    <button id="back-btn" class="icon-btn" title="بازگشت">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    
                    <div class="bot-info">
                        <div class="bot-avatar">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </div>
                        <div class="bot-details">
                            <h2>دستیار املاک</h2>
                            <span class="status">
                                <span class="status-dot"></span>
                                آنلاین
                            </span>
                        </div>
                    </div>

                    <button id="clear-chat-btn" class="icon-btn" title="پاک کردن گفتگو">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- محتوای چت -->
            <div class="chat-messages" id="chat-messages">
                <!-- پیام‌ها اینجا اضافه می‌شوند -->
            </div>

            <!-- نشانگر تایپ -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="typing-avatar">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <div class="typing-dots">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>

            <!-- فرم ارسال پیام -->
            <div class="chat-input-container">
                <form id="message-form" class="message-form">
                    <textarea 
                        id="message-input" 
                        class="message-input" 
                        placeholder="پیام خود را بنویسید..."
                        rows="1"
                        maxlength="5000"
                    ></textarea>
                    <button type="submit" class="send-btn" id="send-btn">
                        <svg class="send-icon" viewBox="0 0 24 24" fill="none">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </form>
                <div class="input-hint">
                    <svg class="hint-icon" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 16V12M12 8H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>برای ارسال پیام، Enter را فشار دهید</span>
                </div>
            </div>
        </div>
    </div>

    <!-- نوتیفیکیشن -->
    <div id="notification" class="notification"></div>

    <!-- اضافه کردن Marked.js برای Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/chat.js"></script>
</body>
</html>
